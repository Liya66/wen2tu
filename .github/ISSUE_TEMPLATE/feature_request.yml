name: Feature request · 功能建议
description: Suggest an idea · 提出一个想法
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do? · 你想完成什么？
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution · 建议的方案
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles · 项目原则
      options:
        - label: This works without accounts or uploading maps to a server. · 不需要账号，也不需要把脑图上传到服务器。
