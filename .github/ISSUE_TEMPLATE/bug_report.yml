name: Bug report · 问题报告
description: Something doesn't work as expected · 功能不符合预期
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened? · 发生了什么？
      description: Include what you expected instead. · 也请说明你期望的结果。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce · 复现步骤
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version · 浏览器及版本
      placeholder: Chrome 140 / Firefox 145 / Safari 26 …
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Was any work lost? · 是否丢失了内容？
      options:
        - "No · 没有"
        - "Yes · 是"
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: Sample file · 示例文件
      description: If a file triggers the problem, attach a small one with private content removed. · 如果问题与某个文件有关，请附上去除隐私内容后的小文件。
