<!doctype html>
<!-- 统计兔 data2tu: wen2tu's chart mode, served at /chart/ (Chinese). /en/chart/ is the English page. -->
<html lang="zh-CN" data-app="chart">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="统计兔 data2tu：把 Excel、CSV 或 AI 回答里的表格粘贴进来，自动选出合适的图。" />
    <link rel="alternate" hreflang="zh-CN" href="/chart/" vite-ignore />
    <link rel="alternate" hreflang="en" href="/en/chart/" vite-ignore />
    <meta name="theme-color" content="#fdfaf5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f2027" media="(prefers-color-scheme: dark)" />
    <title>统计兔 · 粘贴表格自动出图</title>
  </head>
  <body>
    <noscript>统计兔需要启用 JavaScript。data2tu needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/chart/main.tsx"></script>
  </body>
</html>
